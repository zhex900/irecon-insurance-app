name: PR Preview Cleanup

on:
  pull_request:
    types: [closed]

concurrency:
  group: pr-preview-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  destroy:
    name: Destroy preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write UAT env file
        env:
          UAT_ENV_FILE: ${{ secrets.UAT_ENV_FILE }}
        run: |
          if [ -z "$UAT_ENV_FILE" ]; then
            echo "UAT_ENV_FILE secret is not configured."
            exit 1
          fi
          printf '%s\n' "$UAT_ENV_FILE" > .env.uat

      - name: Destroy preview environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_ENV: pr-${{ github.event.pull_request.number }}
        run: PREVIEW_ENV="$PREVIEW_ENV" npm run destroy
