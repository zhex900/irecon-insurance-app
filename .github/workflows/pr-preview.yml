name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  PREVIEW_ENV: pr-${{ github.event.pull_request.number }}

jobs:
  quality:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run quality checks
        run: |
          npm run typecheck
          npm run lint
          npm run test

  deploy:
    name: Deploy preview
    needs: quality
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pr
    outputs:
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Write .env.pr from GitHub secrets
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          UAT_DATABASE_URL: ${{ secrets.UAT_DATABASE_URL }}
          UAT_SUPABASE_URL: ${{ secrets.UAT_SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
        run: node infra/ci-write-env.mjs pr

      - name: Deploy preview environment
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
          PREVIEW_ENV: ${{ env.PREVIEW_ENV }}
        run: |
          set -o pipefail
          npm run deploy:pr -- "$PREVIEW_ENV" 2>&1 | tee deploy.log
          url="$(grep -o 'Preview ready: https://[^ ]*' deploy.log | sed 's/Preview ready: //' | tail -n1)"
          if [ -z "$url" ]; then
            echo "Could not determine preview URL from deploy output."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $url"

  e2e:
    name: E2E (preview)
    needs: deploy
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --user 1001
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Cache npm dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run E2E against preview
        env:
          E2E_SKIP_WEBSERVER: "1"
          E2E_BASE_URL: ${{ needs.deploy.outputs.url }}
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-pr-${{ github.event.pull_request.number }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  comment:
    name: Update PR comment
    needs: [deploy, e2e]
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Post preview URL on PR
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.url }}
          PREVIEW_ENV: ${{ env.PREVIEW_ENV }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        with:
          script: |
            const marker = "<!-- irecon-preview-env -->";
            const prNumber = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const previewUrl = process.env.PREVIEW_URL || "";
            const previewEnv = process.env.PREVIEW_ENV || `pr-${prNumber}`;
            const deployOk = process.env.DEPLOY_RESULT === "success";
            const e2eOk = process.env.E2E_RESULT === "success";
            const e2eSkipped = process.env.E2E_RESULT === "skipped";

            let e2eLine;
            if (e2eSkipped) {
              e2eLine = "Skipped";
            } else if (e2eOk) {
              e2eLine = "Passed";
            } else {
              e2eLine = "Failed";
            }

            const body = [
              marker,
              "## Preview environment",
              "",
              "| | |",
              "| --- | --- |",
              deployOk
                ? `| **URL** | [${previewUrl}](${previewUrl}) |`
                : "| **URL** | Deploy failed — see workflow logs |",
              `| **Environment** | \`${previewEnv}\` |`,
              `| **Commit** | \`${sha}\` |`,
              `| **Deploy** | ${deployOk ? "Succeeded" : "Failed"} |`,
              `| **E2E** | ${e2eLine} |`,
              "",
              "_Updated on every push to this PR. Preview is torn down when the PR closes._",
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
