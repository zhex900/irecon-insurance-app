name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  PREVIEW_ENV: pr-${{ github.event.pull_request.number }}

jobs:
  quality:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit and integration tests
        run: npm run test

  deploy:
    name: Deploy preview
    needs: quality
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write staging env file
        env:
          STAGING_ENV_FILE: ${{ secrets.STAGING_ENV_FILE }}
        run: |
          if [ -z "$STAGING_ENV_FILE" ]; then
            echo "STAGING_ENV_FILE secret is not configured."
            exit 1
          fi
          printf '%s\n' "$STAGING_ENV_FILE" > .env.staging

      - name: Deploy preview environment
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_ENV: ${{ env.PREVIEW_ENV }}
        run: |
          set -o pipefail
          PREVIEW_ENV="$PREVIEW_ENV" npm run deploy 2>&1 | tee deploy.log
          url="$(grep -o 'Preview ready: https://[^ ]*' deploy.log | sed 's/Preview ready: //' | tail -n1)"
          if [ -z "$url" ]; then
            echo "Could not determine preview URL from deploy output."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $url"

  e2e:
    name: E2E (preview)
    needs: deploy
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E against preview
        env:
          E2E_SKIP_WEBSERVER: "1"
          E2E_BASE_URL: ${{ needs.deploy.outputs.url }}
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pr-${{ github.event.pull_request.number }}
          path: playwright-report/
          retention-days: 7

  comment:
    name: Update PR comment
    needs: [deploy, e2e]
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Post preview URL on PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.url }}
          PREVIEW_ENV: ${{ env.PREVIEW_ENV }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        with:
          script: |
            const marker = "<!-- irecon-preview-env -->";
            const prNumber = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const previewUrl = process.env.PREVIEW_URL || "";
            const previewEnv = process.env.PREVIEW_ENV || `pr-${prNumber}`;
            const deployOk = process.env.DEPLOY_RESULT === "success";
            const e2eOk = process.env.E2E_RESULT === "success";
            const e2eSkipped = process.env.E2E_RESULT === "skipped";

            let e2eLine;
            if (e2eSkipped) {
              e2eLine = "Skipped";
            } else if (e2eOk) {
              e2eLine = "Passed";
            } else {
              e2eLine = "Failed";
            }

            const body = [
              marker,
              "## Preview environment",
              "",
              "| | |",
              "| --- | --- |",
              deployOk
                ? `| **URL** | [${previewUrl}](${previewUrl}) |`
                : "| **URL** | Deploy failed — see workflow logs |",
              `| **Environment** | \`${previewEnv}\` |`,
              `| **Commit** | \`${sha}\` |`,
              `| **Deploy** | ${deployOk ? "Succeeded" : "Failed"} |`,
              `| **E2E** | ${e2eLine} |`,
              "",
              "_Updated on every push to this PR. Preview is torn down when the PR closes._",
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
