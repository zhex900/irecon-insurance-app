name: Supabase keepalive

# Free-tier Supabase projects pause after ~7 days without database activity.
# Daily direct Postgres SELECTs reset the inactivity window for UAT and PR projects.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  uat:
    name: UAT Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: uat

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ping UAT database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: node deployment/supabase-keepalive.mjs --label UAT

  pr:
    name: PR Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pr

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ping PR database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node deployment/supabase-keepalive.mjs --label PR
